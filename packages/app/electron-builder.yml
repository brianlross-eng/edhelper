appId: com.gumswampsoftware.edhelper
productName: ED Helper
# electron is hoisted to the workspace root, so electron-builder cannot infer
# the version from packages/app/node_modules — pin it explicitly (keep in sync
# with the root devDependency).
electronVersion: 37.10.3
directories:
  output: release
  buildResources: build
# Everything the app needs at runtime is bundled by electron-vite into out/ —
# the package ships ZERO node_modules. better-sqlite3/zeromq stay dev-machine
# concerns (see the plan's probe facts), so never collect or rebuild deps.
files:
  - out/**
  - package.json
  - "!node_modules/**"
asar: true
# Update channel (v1.12): npm run dist emits latest.yml + .blockmap next to the
# exes; a GitHub release must attach latest.yml, the Setup exe, and its
# blockmap for electron-updater to resolve updates.
publish:
  provider: github
  owner: brianlross-eng
  repo: edhelper
npmRebuild: false
nodeGypRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ED-Helper-Setup-${version}.${ext}
portable:
  artifactName: ED-Helper-Portable-${version}.${ext}
